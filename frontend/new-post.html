<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Post — Aayush Maharjan</title>
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,600;1,400&family=Newsreader:ital@1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111111;
      --fg: #eeeeee;
      --muted: #b4b4b4;
      --subtle: #6e6e6e;
      --border: #2a2a2a;
      --field: #191919;
      --font-sans: "Instrument Sans", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 128px 24px 80px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 400;
    }

    .id {
      margin: 0 0 24px;
      font-size: 14px;
      color: var(--muted);
    }

    h2 {
      display: inline-block;
      margin: 0 0 20px;
      font-size: 15px;
      font-weight: 400;
      border-bottom: 1px solid rgba(238, 238, 238, 0.3);
      padding-bottom: 4px;
    }

    nav { margin-bottom: 48px; }

    nav a {
      color: var(--muted);
      text-decoration: underline;
      text-decoration-color: rgba(255, 255, 255, 0.27);
      text-underline-offset: 3px;
    }

    nav a:hover { color: var(--fg); }

    section { margin-bottom: 8px; }

    input,
    textarea {
      width: 100%;
      margin: 0 0 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--field);
      color: var(--fg);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      outline: none;
    }

    input::placeholder,
    textarea::placeholder { color: var(--subtle); }

    input:focus,
    textarea:focus { border-color: #606060; }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    button {
      margin-top: 4px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--fg);
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover { border-color: #606060; }

    .note {
      margin: 12px 0 0;
      font-size: 14px;
      color: var(--muted);
    }

    .error { color: #d66; }

    @media (max-width: 640px) {
      main { padding-top: 64px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>New Post</h1>
    <p class="id"><strong>Student ID: 79010396</strong></p>
    <nav><a href="blog.html">Back to Blog</a></nav>

    <section id="loginBox">
      <h2>Log in</h2>
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <button onclick="login()">Log in</button>
      <p id="loginError" class="note error"></p>
    </section>

    <section id="postBox" style="display:none;">
      <h2>Create Post</h2>
      <input id="title" placeholder="Title">
      <input id="author" placeholder="Author">
      <textarea id="content" placeholder="Content"></textarea>
      <input id="tags" placeholder="Tags (comma separated)">
      <input id="feature_image" placeholder="Feature image URL (optional)">
      <button onclick="createPost()">Publish</button>
      <p id="postResult" class="note"></p>
    </section>
  </main>

  <script>
    function getToken() {
      return sessionStorage.getItem('idToken');
    }

    function updateView() {
      const token = getToken();
      document.getElementById('loginBox').style.display = token ? 'none' : 'block';
      document.getElementById('postBox').style.display = token ? 'block' : 'none';
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const res = await fetch('https://cognito-idp.us-east-1.amazonaws.com/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-amz-json-1.1',
          'X-Amz-Target': 'AWSCognitoIdentityProviderService.InitiateAuth'
        },
        body: JSON.stringify({
          AuthFlow: 'USER_PASSWORD_AUTH',
          ClientId: COGNITO_CLIENT_ID,
          AuthParameters: { USERNAME: email, PASSWORD: password }
        })
      });

      const data = await res.json();
      if (data.AuthenticationResult) {
        sessionStorage.setItem('idToken', data.AuthenticationResult.IdToken);
        updateView();
      } else {
        document.getElementById('loginError').textContent = data.message || 'Login failed';
      }
    }

    async function createPost() {
      const payload = {
        title: document.getElementById('title').value,
        author: document.getElementById('author').value,
        content: document.getElementById('content').value,
        tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean),
        feature_image: document.getElementById('feature_image').value || undefined
      };

      const res = await fetch(`${API_BASE_URL}/posts`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': getToken()
        },
        body: JSON.stringify(payload)
      });

      document.getElementById('postResult').textContent = res.ok
        ? 'Post created! Check the blog page.'
        : 'Failed to create post.';
    }

    updateView();
  </script>
</body>
</html>
