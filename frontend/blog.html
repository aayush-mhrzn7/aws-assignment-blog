<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Aayush Maharjan</title>
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,600;1,400&family=Newsreader:ital@1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111111;
      --fg: #eeeeee;
      --muted: #b4b4b4;
      --subtle: #6e6e6e;
      --border: #2a2a2a;
      --font-sans: "Instrument Sans", system-ui, -apple-system, sans-serif;
      --font-serif: "Newsreader", Georgia, serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 128px 24px 80px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 400;
    }

    .id {
      margin: 0 0 24px;
      font-size: 14px;
      color: var(--muted);
    }

    nav { margin-bottom: 48px; }

    nav a {
      color: var(--muted);
      text-decoration: underline;
      text-decoration-color: rgba(255, 255, 255, 0.27);
      text-underline-offset: 3px;
    }

    nav a:hover { color: var(--fg); }

    article {
      padding: 0 0 28px;
      margin: 0 0 28px;
      border-bottom: 1px solid var(--border);
    }

    article:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: 0;
    }

    article .feature-image {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 6px;
      margin: 0 0 16px;
      display: block;
    }

    article h2 {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 400;
    }

    article .meta {
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--muted);
    }

    article .meta em {
      font-family: var(--font-serif);
      font-style: italic;
    }

    article p {
      margin: 0;
    }

    .note {
      margin: 0;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      main { padding-top: 64px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Blog</h1>
    <p class="id"><strong>Student ID: 79010396</strong></p>
    <nav><a href="index.html">Back to Portfolio</a></nav>
    <div id="posts"><p class="note">Loading...</p></div>
  </main>

  <script>
    fetch(`${API_BASE_URL}/posts`)
      .then(res => res.json())
      .then(posts => {
        const container = document.getElementById('posts');
        if (posts.length === 0) {
          container.innerHTML = '<p class="note">No posts yet.</p>';
          return;
        }
        container.innerHTML = posts.map(p => `
          <article>
            ${p.feature_image ? `<img class="feature-image" src="${p.feature_image}" alt="${p.title}">` : ''}
            <h2>${p.title}</h2>
            <p class="meta"><em>by ${p.author}</em></p>
            <p>${p.content}</p>
          </article>
        `).join('');
      })
      .catch(err => {
        document.getElementById('posts').innerHTML = '<p class="note">Failed to load posts.</p>';
        console.error(err);
      });
  </script>
</body>
</html>
