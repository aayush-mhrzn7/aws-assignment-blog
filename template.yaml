AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  PostsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: s79010396-posts
      PrimaryKey:
        Name: postId
        Type: String

  BlogApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: s79010396-api
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  ListPostsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: s79010396-list-posts
      CodeUri: functions/
      Handler: list_posts.handler
      Runtime: python3.12
      Role: arn:aws:iam::305909191130:role/LabRole
      Events:
        ListPosts:
          Type: Api
          Properties:
            RestApiId: !Ref BlogApi
            Path: /posts
            Method: get

  CreatePostFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: s79010396-create-post
      CodeUri: functions/
      Handler: create_post.handler
      Runtime: python3.12
      Role: arn:aws:iam::305909191130:role/LabRole
      Events:
        CreatePost:
          Type: Api
          Properties:
            RestApiId: !Ref BlogApi
            Path: /posts
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: s79010396-site
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${SiteBucket.Arn}/*'

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: s79010396-user-pool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: s79010396-app-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub "https://${BlogApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  SiteUrl:
    Description: Portfolio/blog website URL
    Value: !GetAtt SiteBucket.WebsiteURL
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient
