AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  PostsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: s79010396-posts
      PrimaryKey:
        Name: postId
        Type: String
  ListPostsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: s79010396-list-posts
      CodeUri: ListPostsFunction
      Handler: list_posts.handler
      Runtime: python3.12
      Role: arn:aws:iam::305909191130:role/LabRole
      Events:
        ListPosts:
          Type: Api
          Properties:
            Path: /posts
            Method: get
    Metadata:
      SamResourceId: ListPostsFunction
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: s79010396-site
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: SiteBucket
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal: '*'
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${SiteBucket.Arn}/*
Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
  SiteUrl:
    Description: Portfolio/blog website URL
    Value:
      Fn::GetAtt:
      - SiteBucket
      - WebsiteURL
